elevation_mapping:
  ros__parameters:
    inputs: ["sim_camera"] # A name to identify the input source

    sim_camera:
      type: pointcloud # Supported types: pointcloud
      topic: coppeliasim/point_cloud/cloud_registered
      queue_size: 1
      publish_on_update: true # Whether to publish the elevation map after a callback from this source.
      sensor_processor:
        type: perfect
        ignore_points_above: 1.0
        ignore_points_below: -1.0
    map_frame_id: "map"
    robot_base_frame_id: "base_link" 
    robot_pose_with_covariance_topic: "" # Leaving this empty skipps pose covariance updates.
    robot_pose_cache_size: 200
    track_point_frame_id: "camera_0_link"
    track_point_x: 0.0
    track_point_y: 0.0
    track_point_z: 0.0
